name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-build:
    name: macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build native app
        run: swift build --package-path native/macos

  windows-test-and-coverage:
    name: Windows tests and coverage
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests and create LCOV report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path coverage -Force | Out-Null
          cargo llvm-cov --manifest-path native/windows/Cargo.toml --lcov --output-path coverage/lcov.info
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
