name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-build:
    name: macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build native app
        run: swift build --package-path native/macos

  windows-test-and-coverage:
    name: Windows tests and coverage
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests and create LCOV report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path coverage -Force | Out-Null
          cargo llvm-cov --manifest-path native/windows/Cargo.toml --lcov --output-path coverage/lcov.info
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

  linux-build-and-test:
    name: Ubuntu native build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libayatana-appindicator3-dev libpulse-dev libcurl4-openssl-dev libjson-glib-dev
      - name: Build and test
        run: ./native/linux/build.sh --test
      - name: Build Ubuntu package
        run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KeyScribe-ubuntu-amd64
          path: dist-native/linux/KeyScribe-ubuntu-*.deb
